spring:
  application:
    name: gestao-escolar

  # Configuração do Banco de Dados PostgreSQL com Variáveis de Ambiente
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_escolar}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:michael8833}

  # Configurações do JPA / Hibernate adaptáveis
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

# Configuração de Logs
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE